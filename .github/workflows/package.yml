name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Packaging tests
        run: |
          python -m pip install pytest ruff
          python -m ruff check scripts/build_release.py scripts/msys2_poppler.py tests/test_release_packaging.py
          # --noconftest: the root conftest sets up the product's test fixtures, which need its dependencies.
          python -m pytest tests/test_release_packaging.py -q --noconftest
          sh -n scripts/install.sh

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x86_64
            runner: macos-15-intel
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-x86_64
            runner: windows-2025
            msvc_arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            msvc_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # The action's default arch is x64. On windows-11-arm that cross-compiles the
      # launcher and Rust extensions to x64. arch follows the runner instead.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build the release archive
        run: python scripts/build_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/misaka-*
          if-no-files-found: error
