name: Windows checks

# The parts of MISAKA that behave differently on Windows, run on a real Windows runner on demand:
# the live-skill guard on every whitespace, the event-loop watchdog (faulthandler's timer and
# exit), MCP's environment, reclaiming a dead Sister root, the token-cap ledger.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test. Empty tests the workflow's own ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    # x64 only: on windows-11-arm, `uv sync` builds cryptography from source and fails (the
    # release build installs a prebuilt arm64 wheel instead; see scripts/build_release.py).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install
        run: |
          python -m pip install uv
          uv sync --group dev
      - name: Tests
        run: >-
          uv run python -m pytest -q -p no:cacheprovider
          tests/test_loop_watchdog.py tests/test_mcp_server_env.py
          tests/test_windows_orphan_reclaim.py tests/test_token_cap.py tests/test_research_cli_in_pane.py
