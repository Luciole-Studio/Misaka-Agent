[project]
name = "misaka"
version = "0.19.29"
description = "A research team of AI agents for the humanities and social sciences"
requires-python = ">=3.12"
authors = [{ name = "makiko", email = "nishikinokki@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "referencing>=0.36",
    "httpx>=0.28",
    "mcp[ws]>=1.30,<2",
    "ruamel.yaml>=0.18",
    "pathspec>=0.12",
    "pyte>=0.8.2",
    "psutil>=6.1",
    "wcmatch>=10.0",
    "filelock>=3.32.3",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "pypdfium2==4.30.0",
    "PyPDF2==3.0.1",
    "pycryptodome>=3.20",
    "regex>=2024.0.0",
    "sortedcontainers==2.4.0",
    "pillow>=10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "tiktoken>=0.14.0",
    "wasmtime>=49,<50",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.99,<1"]
openai = ["openai>=1.60"]
google = ["google-genai>=1.0"]
bedrock = ["boto3>=1.35"]
providers = ["misaka[anthropic,openai,google,bedrock]"]
browser = ["websockets>=15,<17", "cryptography>=43"]
lcm-semantic = ["fastembed"]
pageindex = []

[project.scripts]
misaka = "misaka.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["misaka[providers,pageindex]", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.5"]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["misaka"]
exclude = [
  "misaka/extensions/misaka_lcm/vendor/tests",
  "misaka/extensions/misaka_lcm/vendor/benchmarks",
  "misaka/extensions/misaka_lcm/vendor/benchmarking",
  "misaka/extensions/misaka_lcm/vendor/bench",
  "misaka/extensions/misaka_lcm/vendor/.github",
  "misaka/extensions/misaka_lcm/vendor/docs/*.png",
]

[tool.ruff]
extend-exclude = ["misaka/core/documents/pageindex/flash", "misaka/core/documents/pageindex/naming.py", "misaka/core/skills/assets", "misaka/core/skills/vendor", "tests/skills_hermes_native", "misaka/extensions/misaka_lcm/vendor", "misaka/extensions/misaka_lcm/native", "tests/hermes_lcm_native", "tests/web/fixtures", "scripts/check-windows-footguns.py"]

[tool.ruff.lint]
extend-select = ["ASYNC210", "ASYNC220", "ASYNC221", "ASYNC222", "ASYNC230", "ASYNC251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["hermes_lcm_vendor", "hermes_lcm_native"]
