# MISAKA: dependencies are the union of the inlined pi/harn Python engine and the MISAKA product layer.
# Rebuild the environment (two steps):
#   uv venv .venv --python 3.13
#   uv pip install --python .venv -e .      # installs deps, creates .venv/bin/misaka, makes the package importable
[project]
name = "misaka"
version = "0.6.0"
description = "MISAKA: a multi-agent research system for the humanities and social sciences, built on the pi/harn Python engine"
requires-python = ">=3.12"
dependencies = [
    # engine/ai (formerly harn_ai)
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "openai>=1.60",
    "anthropic>=0.45",
    "google-genai>=1.0",
    "boto3>=1.35",
    "mistralai>=1.5",
    "json-repair>=0.30",
    "websockets>=16",
    # engine/agent (formerly harn_agent)
    "aiofiles>=24.1",
    "ruamel.yaml>=0.18",
    "jsonlines>=4.0",
    "pathspec>=0.12",
    # net (pane hosting: one terminal emulator screen per pane)
    "pyte>=0.8.2",
    # engine/tui (formerly harn_tui)
    "blessed>=1.20",
    "markdown-it-py>=4.2",
    "mdit-py-plugins>=0.4",   # dollarmath: LaTeX math detection (parity with pi 05e89b4)
    "pylatexenc>=2.10",       # LaTeX -> Unicode rendering layer
    "rich>=13.9",
    "wcwidth>=0.2",
    "rapidfuzz>=3.10",
    "term-image>=0.7",
    # engine/coding_agent (formerly harn_coding_agent)
    "click>=8.1",
    "psutil>=6.1",
    "wcmatch>=10.0",
    "filelock>=3.16",
    "pygments>=2.18",
    "diff-match-patch>=20230430",
    "python-frontmatter>=1.1",
    # MISAKA's own (mcp.py reads config.yaml)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lcm-semantic = ["fastembed"]
pageindex = [
    "PyPDF2==3.0.1",
    "pymupdf==1.26.4",
    "pypdfium2==4.30.0",
    "regex>=2024.0.0",
    "sortedcontainers==2.4.0",
]

[project.scripts]
misaka = "misaka.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every importable package at the repo root (exposed by the editable install; replaces a hand-written .pth)
packages = ["misaka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
